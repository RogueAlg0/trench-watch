<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Trench</title>
<style>
  html, body { margin:0; padding:0; background:#060607; height:100%; overflow:hidden;
    font-family: Georgia, 'Times New Roman', serif; }
  #stage { position:fixed; inset:0; }
  canvas { display:block; touch-action:none; width:100%; height:100%; }
  #setup { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; background:#060607; color:#d8d2c4; z-index:5; padding:24px;
    box-sizing:border-box; text-align:center; }
  #setup h1 { font-weight:normal; letter-spacing:.35em; font-size:20px; margin:0 0 6px; color:#e8e2d2; }
  #setup p { margin:0 0 30px; font-size:13px; color:#8b8578; letter-spacing:.08em; }
  #setup label { display:block; font-size:11px; letter-spacing:.25em; color:#8b8578; margin:18px 0 8px; }
  #setup input { background:#141419; border:1px solid #33333d; color:#e8e2d2; font-family:inherit;
    font-size:17px; padding:10px 14px; width:min(320px, 82vw); text-align:center; border-radius:3px; outline:none; }
  #setup input:focus { border-color:#6b6b78; }
  #begin { margin-top:34px; background:none; border:1px solid #55555f; color:#e8e2d2;
    font-family:inherit; font-size:14px; letter-spacing:.3em; padding:12px 38px 12px 41px; cursor:pointer; border-radius:3px; }
  #begin:hover { background:#1b1b21; }
  #dice { margin-top:14px; background:none; border:none; color:#8b8578; font-family:inherit;
    font-size:12px; letter-spacing:.15em; cursor:pointer; }
  #dice:hover { color:#d8d2c4; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="setup">
  <h1>TRENCH</h1>
  <p>a war you only watch</p>
  <label for="planet">PLANET NAME</label>
  <input id="planet" type="text" maxlength="24" autocomplete="off" spellcheck="false">
  <label for="seed">SEED</label>
  <input id="seed" type="text" maxlength="24" autocomplete="off" spellcheck="false">
  <button id="begin">BEGIN</button>
  <button id="dice">random seed</button>
</div>

<script>
'use strict';
/* ================= deterministic RNG ================= */
function hashStr(s){ let h = 2166136261 >>> 0; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry32(a){ return function(){ a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let rng = mulberry32(1);
const rr = (a,b)=> a + rng()*(b-a), ri = (a,b)=> Math.floor(rr(a, b+0.999)), pick = arr => arr[Math.floor(rng()*arr.length) % arr.length];
const clamp = (v,a,b)=> Math.max(a, Math.min(b, v)), lerp = (a,b,k)=> a+(b-a)*k;
function hash2(x, y){ const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); }
function vnoise(x, y){ const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash2(xi, yi), hash2(xi + 1, yi), u), lerp(hash2(xi, yi + 1), hash2(xi + 1, yi + 1), u), v); }

/* ================= canvas: full-bleed, DPR-aware ================= */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let VW = 1280, VH = 720, DPR = 1;
function fit(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = window.innerWidth; VH = window.innerHeight;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  baseZoom = VW < VH ? clamp(Math.max(VW / 680, VH / 1180), 0.55, 0.95) : clamp(VW / 1250, 0.7, 1.05);  // portrait: fit the field's height, roam its width
  if (cam.mode === 'director') cam.zoom += (baseZoom * cam.dzoom - cam.zoom) * 0.5;
}
let baseZoom = 1;
addEventListener('resize', fit);

/* ================= iso projection ================= */
const TW = 64, TH = 32, ZH = 19;                               // tile w/h, px per z level
const MW = 42, MH = 27;                                        // map size in tiles
function isoX(fx, fy){ return (fx - fy) * TW / 2; }
function isoY(fx, fy, z){ return (fx + fy) * TH / 2 - (z || 0) * ZH; }

/* ================= camera: user's hands, director at idle ================= */
const cam = { x: 224, y: 520, zoom: 1, mode: 'director', idleT: 0, tx: 224, ty: 520, dzoom: 1, focusT: 0 };
const IDLE_DIRECTOR_S = 9;
function camDirector(dt){
  cam.focusT -= dt;
  if (cam.focusT <= 0){ cam.focusT = rr(13, 22);
    const foci = [ [224, 535, 1], [-192, 451, 1.3], [352, 451, 1.28], [166, 520, 1.18],
                   [496, 392, 1.05], [-480, 432, 1.2], [32, 590, 1.32], [60, 470, 1.08] ];
    const f = pick(foci); cam.tx = f[0] + rr(-26, 26); cam.ty = f[1] + rr(-14, 14); cam.dzoom = f[2]; }
  const k = Math.min(1, dt * 0.3);
  cam.x = lerp(cam.x, cam.tx, k); cam.y = lerp(cam.y, cam.ty, k);
  cam.zoom = lerp(cam.zoom, baseZoom * cam.dzoom, Math.min(1, dt * 0.5));
}
function camUpdate(dt){
  if (cam.mode === 'user'){ cam.idleT += dt;
    if (cam.idleT > IDLE_DIRECTOR_S){ cam.mode = 'director'; cam.tx = cam.x; cam.ty = cam.y; cam.focusT = 0; } }
  else camDirector(dt);
  cam.x = clamp(cam.x, -760, 1150); cam.y = clamp(cam.y, 180, 860);
  cam.zoom = clamp(cam.zoom, 0.55, 3.2);
}
function toScreen(wx, wy){ return [ (wx - cam.x) * cam.zoom + VW/2, (wy - cam.y) * cam.zoom + VH/2 ]; }
/* pointer control: drag pans, wheel zooms, pinch zooms */
const pointers = new Map(); let pinchD = 0;
function userGrab(){ cam.mode = 'user'; cam.idleT = 0; }
cv.addEventListener('pointerdown', e => { pointers.set(e.pointerId, [e.clientX, e.clientY]); userGrab();
  if (pointers.size === 2){ const p = [...pointers.values()]; pinchD = Math.hypot(p[0][0]-p[1][0], p[0][1]-p[1][1]); } });
cv.addEventListener('pointermove', e => { if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]); userGrab();
  if (pointers.size === 1){ cam.x -= (e.clientX - prev[0]) / cam.zoom; cam.y -= (e.clientY - prev[1]) / cam.zoom; }
  else if (pointers.size === 2){ const p = [...pointers.values()];
    const d = Math.hypot(p[0][0]-p[1][0], p[0][1]-p[1][1]);
    if (pinchD > 0) cam.zoom = clamp(cam.zoom * d / pinchD, 0.55, 3.2); pinchD = d; } });
['pointerup','pointercancel'].forEach(ev => cv.addEventListener(ev, e => { pointers.delete(e.pointerId); pinchD = 0; }));
cv.addEventListener('wheel', e => { e.preventDefault(); userGrab();
  cam.zoom = clamp(cam.zoom * (e.deltaY < 0 ? 1.09 : 0.92), 0.55, 3.2); }, { passive: false });

/* ================= palette ================= */
let PAL = null;
function makePalette(){
  const families = [
    { sky:[196,32,26], soil:[88,26,25],  accent:[38,95,55]  },
    { sky:[222,28,27], soil:[210,18,23], accent:[28,90,55]  },
    { sky:[18,38,26],  soil:[24,30,24],  accent:[190,85,55] },
    { sky:[268,26,24], soil:[262,16,22], accent:[44,92,55]  },
    { sky:[150,22,26], soil:[95,20,23],  accent:[16,88,52]  } ];
  const f = pick(families), hsl = (h,s,l)=>`hsl(${h},${s}%,${l}%)`;
  return { skyDay: hsl(f.sky[0], f.sky[1] - 8, 50), skyNight: hsl(f.sky[0], 30, 6),
    soilC: [f.soil[0], f.soil[1], f.soil[2]], grassC: [f.soil[0] + 30, 18, f.soil[2] + 4],
    soil: hsl(f.soil[0], f.soil[1], f.soil[2]), freshSoil: hsl(f.soil[0], f.soil[1] - 4, f.soil[2] + 9), soilDark: hsl(f.soil[0], f.soil[1], f.soil[2]-6),
    soilDeep: hsl(f.soil[0], f.soil[1], Math.max(4, f.soil[2]-11)),
    grass: hsl(f.soil[0]+30, 18, f.soil[2]+4),
    timber: hsl(32, 30, 34), timberDark: hsl(32, 28, 22), cloth: hsl(f.soil[0]+20, 12, 42),
    uniform: hsl(f.soil[0]+8, 16, 38), uniformDark: hsl(f.soil[0]+8, 16, 26),
    skin: hsl(28, 42, 60), skinDark: hsl(28, 36, 48),
    accent: hsl(f.accent[0], f.accent[1], f.accent[2]), accent2: hsl((f.accent[0]+150)%360, 80, 58),
    moon: hsl(f.sky[0], 20, 84) };
}
fit();

/* ================= the field ================= */
const DAY_LEN = 110;
let sim = null, perfT = 0, simLight = 1;
const trenchY = gx => 13 + (Math.floor(gx / 4) % 2 ? 1 : 0);
const enemyY  = gx => 4 + (Math.floor(gx / 5) % 2 ? 1 : 0);
function tileAt(gx, gy){ return (gx < 0 || gy < 0 || gx >= MW || gy >= MH) ? null : sim.grid[gy][gx]; }
function buildMap(){
  const grid = [];
  for (let gy = 0; gy < MH; gy++){ grid.push([]);
    for (let gx = 0; gx < MW; gx++) grid[gy].push({ gx, gy, z: 0, type: 'ground',
      damage: 0, patched: 0, chips: 0, stain: 0, worn: 0, rubble: 0, filled: false, sap: false, fitted: false }); }
  const set = (gx, gy, type, z) => { const t = grid[gy] && grid[gy][gx]; if (t){ t.type = type; t.z = z; } };
  // enemy line
  for (let gx = 2; gx < 40; gx++) set(gx, enemyY(gx), 'etrench', -1);
  // our line, with fire steps
  for (let gx = 3; gx < 39; gx++){ set(gx, trenchY(gx), 'trench', -1); grid[trenchY(gx)][gx].step = true; }
  // communication trench + supply bay
  for (let gy = 14; gy <= 19; gy++) set(19, gy, 'trench', -1);
  set(20, 18, 'trench', -1); set(20, 19, 'trench', -1);
  // dugout A (signaller, bunks) and aid room, with connector traverses
  const room = (x0, x1, kind) => { for (let gx = x0; gx <= x1; gx++){
      for (let gy = trenchY(gx) + 1; gy <= 17; gy++) if (grid[gy][gx].type === 'ground') set(gx, gy, 'trench', -1);
      for (let gy = 15; gy <= 17; gy++) set(gx, gy, kind, -1); } };
  room(9, 12, 'dug'); room(26, 29, 'dug');
  // craters in no man's land
  for (let i = 0; i < 16; i++){ const gx = ri(3, 38), gy = ri(6, 11); set(gx, gy, 'crater', -0.35); }
  // wire belts
  const wire = [];
  for (let gx = 4; gx < 38; gx += 2){ wire.push([gx, 11]); if (hash2(gx, 31) < 0.6) wire.push([gx + 1, 8]); }
  // ladder edges: z-changes are only ever made here (or by raiders scrambling)
  const ladders = new Set();
  const lad = (a, b) => { ladders.add(a + '>' + b); ladders.add(b + '>' + a); };
  lad('19,19', '19,20');            // comm trench up to the rear
  lad('9,17', '9,20'); lad('29,17', '29,20');   // dugout shafts to their hatches
  return { grid, wire, ladders,
    hatchTiles: [[9, 20], [29, 20]],
    sentryTiles: [5, 9, 13, 17, 21, 25, 29, 33, 36].map(gx => [gx, trenchY(gx)]),
    bunkTiles: [[10, 17], [11, 17], [12, 17], [27, 17], [28, 17]],
    graveTiles: [[5, 21], [6, 21], [7, 21], [5, 22], [6, 22], [7, 22], [4, 21], [4, 22], [8, 21], [8, 22], [5, 20], [6, 20]] };
}
function walkable(t, enemy){
  if (!t) return false;
  if (t.type === 'etrench') return !!enemy;
  return ['ground','crater','trench','dug'].includes(t.type);
}
function findPath(sx, sy, tx, ty, opts){
  opts = opts || {};
  const key = (x, y) => x + ',' + y;
  const start = tileAt(sx, sy), goal = tileAt(tx, ty);
  if (!start || !goal) return null;
  const q = [[sx, sy]], prev = new Map([[key(sx, sy), null]]);
  while (q.length){ const [cx, cy] = q.shift();
    if (cx === tx && cy === ty) break;
    const ct = tileAt(cx, cy);
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx = cx + dx, ny = cy + dy, nt = tileAt(nx, ny);
      if (!nt || prev.has(key(nx, ny)) || !walkable(nt, opts.enemy)) continue;
      const dz = Math.abs(nt.z - ct.z);
      const ladderEdge = sim.map.ladders.has(key(cx, cy) + '>' + key(nx, ny));
      if (dz > 0.6 && !ladderEdge && !opts.scramble) continue;
      prev.set(key(nx, ny), [cx, cy]); q.push([nx, ny]); } }
  if (!prev.has(key(tx, ty))) return null;
  const path = []; let cur = [tx, ty];
  while (cur){ path.unshift(cur); cur = prev.get(key(cur[0], cur[1])); }
  return path;
}

/* ================= tile rendering ================= */
function diamond(gx, gy, z, inset){
  const i = inset || 0;
  return [ [isoX(gx + i, gy + i), isoY(gx + i, gy + i, z)], [isoX(gx + 1 - i, gy + i), isoY(gx + 1 - i, gy + i, z)],
           [isoX(gx + 1 - i, gy + 1 - i), isoY(gx + 1 - i, gy + 1 - i, z)], [isoX(gx + i, gy + 1 - i), isoY(gx + i, gy + 1 - i, z)] ];
}
function poly(pts, fill){ ctx.fillStyle = fill; ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fill(); }
function drawTile(t){
  const { gx, gy, z } = t;
  // faces toward +gx and +gy where the neighbour is lower: pit walls and block sides
  const nE = tileAt(gx + 1, gy), nS = tileAt(gx, gy + 1);
  const c = { '00': [isoX(gx, gy), isoY(gx, gy, z)], '10': [isoX(gx + 1, gy), isoY(gx + 1, gy, z)],
              '11': [isoX(gx + 1, gy + 1), isoY(gx + 1, gy + 1, z)], '01': [isoX(gx, gy + 1), isoY(gx, gy + 1, z)] };
  const dugWall = t.type === 'trench' || t.type === 'dug' || (nE && (nE.type === 'trench' || nE.type === 'dug')) || (nS && (nS.type === 'trench' || nS.type === 'dug'));
  const faceCol = PAL.soilDark;
  if (nE && nE.z < z - 0.01){ const drop = (z - nE.z) * ZH;
    poly([c['10'], c['11'], [c['11'][0], c['11'][1] + drop], [c['10'][0], c['10'][1] + drop]], faceCol);
    if (dugWall){ ctx.strokeStyle = PAL.timberDark; ctx.lineWidth = 2.2;
      [0.36, 0.7].forEach(k => { ctx.beginPath();
        ctx.moveTo(c['10'][0], c['10'][1] + drop * k); ctx.lineTo(c['11'][0], c['11'][1] + drop * k); ctx.stroke(); }); } }
  if (nS && nS.z < z - 0.01){ const drop = (z - nS.z) * ZH;
    poly([c['01'], c['11'], [c['11'][0], c['11'][1] + drop], [c['01'][0], c['01'][1] + drop]], faceCol);
    if (dugWall){ ctx.strokeStyle = PAL.timberDark; ctx.lineWidth = 2.2;
      [0.36, 0.7].forEach(k => { ctx.beginPath();
        ctx.moveTo(c['01'][0], c['01'][1] + drop * k); ctx.lineTo(c['11'][0], c['11'][1] + drop * k); ctx.stroke(); }); } }
  // top: smooth value-noise ground, no blocks; per-tile jitter stays subtle
  let top = PAL.grass;
  const hv = hash2(gx * 3.1, gy * 5.7);
  if (t.type === 'ground'){ const n = vnoise(gx * 0.3 + 9, gy * 0.3 + 3);
    top = `hsl(${lerp(PAL.grassC[0], PAL.soilC[0], n)},${lerp(PAL.grassC[1], PAL.soilC[1], n)}%,${lerp(PAL.grassC[2], PAL.soilC[2], n)}%)`; }
  else if (t.type === 'trench' || t.type === 'etrench') top = PAL.soilDark;
  else if (t.type === 'dug') top = PAL.timber;
  else if (t.type === 'crater') top = t.filled ? PAL.freshSoil : PAL.soilDeep;
  else if (t.type === 'sapdig') top = PAL.soilDark;
  poly([c['00'], c['10'], c['11'], c['01']], top);
  if (t.type === 'ground'){ const j = (hv - 0.5) * 0.13;                                        // quiet per-tile jitter
    ctx.fillStyle = j > 0 ? `rgba(255,246,225,${j})` : `rgba(0,0,0,${-j})`;
    poly([c['00'], c['10'], c['11'], c['01']], ctx.fillStyle);
    if (hv > 0.86){ ctx.fillStyle = PAL.timberDark;                                             // a lost plank
      const px = isoX(gx + 0.5, gy + 0.5), py = isoY(gx + 0.5, gy + 0.5, z);
      ctx.save(); ctx.translate(px, py); ctx.rotate(0.5 + hv); ctx.fillRect(-6, -1, 12, 2); ctx.restore(); }
    // sandbags on the lip above a trench (ours face +gy, theirs face -gy); damage slumps them
    const bagRow = (edge, dmg) => { ctx.fillStyle = PAL.cloth;
      for (let i = 0; i < 4; i++){ const k = 0.14 + i * 0.24;
        if (hash2(gx * 11 + i, gy * 5) < dmg * 0.35) continue;                    // this bag is gone
        const slumped = hash2(gx * 7 + i, gy * 3) < dmg * 0.7;
        const bx = lerp(edge[0][0], edge[1][0], k), by = lerp(edge[0][1], edge[1][1], k);
        ctx.beginPath(); ctx.ellipse(bx, by - 1.6 - (i % 2) * 2.2 + (slumped ? 3 : 0), 6.4, slumped ? 1.9 : 2.7, 0, 0, 6.29); ctx.fill(); } };
    const nDn = tileAt(gx, gy + 1), nUp = tileAt(gx, gy - 1);
    if (nDn && nDn.type === 'trench') bagRow([c['01'], c['11']], Math.max(t.damage, t.chips / 14));
    if (nUp && nUp.type === 'etrench') bagRow([c['00'], c['10']], nUp ? Math.max(nUp.damage, nUp.chips / 14) : 0); }
  // detail, all seeded by position
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  if (t.type === 'ground'){ for (let i=0;i<3;i++) if (hash2(gx * 7 + i, gy * 3) < 0.55)
      ctx.fillRect(isoX(gx + hash2(gx, i), gy + hash2(gy, i + 9)) - 1, isoY(gx + hash2(gx, i), gy + hash2(gy, i + 9), z) - 0.5, 2.2, 1.1);
    if (hv > 0.9){ ctx.strokeStyle = 'rgba(20,22,14,.38)'; ctx.lineWidth = 1;               // weed tuft, three blades
      const wx = isoX(gx + 0.5, gy + 0.5), wy = isoY(gx + 0.5, gy + 0.5, z), sw = Math.sin(perfT + gx) * 0.9;
      ctx.beginPath();
      ctx.moveTo(wx - 2, wy); ctx.quadraticCurveTo(wx - 2.6 + sw * 0.4, wy - 3, wx - 3.4 + sw, wy - 5);
      ctx.moveTo(wx, wy); ctx.quadraticCurveTo(wx + sw * 0.4, wy - 3.4, wx + sw, wy - 6);
      ctx.moveTo(wx + 2, wy); ctx.quadraticCurveTo(wx + 2.6 + sw * 0.4, wy - 3, wx + 3.4 + sw, wy - 4.6); ctx.stroke(); }
    const worn = tileAt(gx, gy - 1);                                                          // traffic-worn strip behind the line
    if (worn && worn.type === 'trench'){ ctx.fillStyle = 'rgba(0,0,0,.1)';
      poly([c['00'], c['10'], c['11'], c['01']], ctx.fillStyle); } }
  if (t.type === 'trench' && hash2(gx, gy) < 0.72){                                          // duckboards
    ctx.strokeStyle = 'rgba(96,70,40,.75)'; ctx.lineWidth = 2;
    ctx.beginPath(); const a = [isoX(gx + 0.16, gy + 0.5), isoY(gx + 0.16, gy + 0.5, z)], b = [isoX(gx + 0.84, gy + 0.5), isoY(gx + 0.84, gy + 0.5, z)];
    ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
  if (t.step){ const stepZ = -0.45 - (t.damage > 0.4 ? 0.12 : 0);                              // a hit step sags
    const stepCol = (t.patched > 0 && t.damage < 0.2) ? 'rgb(168,140,102)' : PAL.timber;        // a mended step is pale new wood
    poly([ [isoX(gx, gy), isoY(gx, gy, stepZ)], [isoX(gx + 1, gy), isoY(gx + 1, gy, stepZ)],
           [isoX(gx + 1, gy + 0.34), isoY(gx + 1, gy + 0.34, stepZ)], [isoX(gx, gy + 0.34), isoY(gx, gy + 0.34, stepZ)] ], stepCol);
    poly([ [isoX(gx, gy + 0.34), isoY(gx, gy + 0.34, stepZ)], [isoX(gx + 1, gy + 0.34), isoY(gx + 1, gy + 0.34, stepZ)],
           [isoX(gx + 1, gy + 0.34), isoY(gx + 1, gy + 0.34, -1)], [isoX(gx, gy + 0.34), isoY(gx, gy + 0.34, -1)] ], PAL.timberDark);
    if (t.damage > 0.4){ ctx.strokeStyle = 'rgba(8,6,4,.7)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(isoX(gx + 0.3, gy + 0.05), isoY(gx + 0.3, gy + 0.05, stepZ));
      ctx.lineTo(isoX(gx + 0.52, gy + 0.2), isoY(gx + 0.52, gy + 0.2, stepZ)); ctx.lineTo(isoX(gx + 0.78, gy + 0.1), isoY(gx + 0.78, gy + 0.1, stepZ)); ctx.stroke(); } }
  if (t.type === 'sapdig'){ ctx.fillStyle = PAL.soil;                                          // spoil heap beside the digging
    ctx.beginPath(); ctx.ellipse(isoX(gx + 0.72, gy + 0.72), isoY(gx + 0.72, gy + 0.72, z), 8.6, 3, 0, 0, 6.29); ctx.fill(); }
  if (t.sap && t.fitted){ ctx.fillStyle = PAL.cloth;                                           // the sap head wears its own bags
    for (let i = 0; i < 4; i++){ const k = 0.14 + i * 0.24;

/* ================= soldiers ================= */
let SID = 0;
function makeSoldier(role, postTile){
  return { id: SID++, role, fx: postTile[0] + 0.5, fy: postTile[1] + 0.5, z: -1, zOff: 0,
    tx: postTile[0], ty: postTile[1], path: null, pathI: 0, destFx: postTile[0] + 0.5, destFy: postTile[1] + 0.5,
    h: rr(0.94, 1.05), scarf: rng() < 0.32 ? pick(['accent','accent2']) : 'none',
    state: 'idle', tState: rr(0, 3), stateAge: 0, speed: rr(0.8, 0.95), phase: rr(0, 6.28),
    faceA: -Math.PI / 2, vx: 0, vy: 0, duck: 0, climbing: null, onStep: false,
    brave: rng(), warm: rng(), friend: -1, grief: 0, jumpy: 0, clean: 0, letterT: rr(4, 44),
    vig: null, duty: null, dead: false, arriveAct: null, shootAt: 0, fired: false, fumbled: false };
}
function setState(s, st, dur){ s.state = st; s.tState = dur; s.stateAge = 0; }
function goTo(s, gx, gy, opts){
  opts = opts || {};
  const path = findPath(Math.floor(s.fx), Math.floor(s.fy), gx, gy, opts);
  if (!path) return false;
  s.path = path; s.pathI = 1;
  s.destFx = (opts.fx !== undefined) ? gx + opts.fx : gx + 0.5;
  s.destFy = (opts.fy !== undefined) ? gy + opts.fy : gy + 0.5;
  s.arriveAct = opts.act || 'idle'; s.onStep = !!opts.step;

  return true;
}
function soldierMove(s, dt){
  if (s.climbing){ const c = s.climbing; c.t -= dt;
    s.z = lerp(c.z1, c.z0, Math.max(0, c.t / c.dur));
    s.phase += dt * 5;
    if (c.t <= 0){ s.z = c.z1; s.climbing = null; }
    return; }
  if (!s.path || s.pathI >= s.path.length){
    const tz = (tileAt(Math.floor(s.fx), Math.floor(s.fy)) || { z: 0 }).z + (s.onStep ? 0.55 : 0);
    s.z += (tz - s.z) * Math.min(1, dt * 7); s.vx = 0; s.vy = 0; return; }
  const node = s.path[s.pathI];
  const isLast = s.pathI === s.path.length - 1;
  const wx = isLast ? s.destFx : node[0] + 0.5, wy = isLast ? s.destFy : node[1] + 0.5;
  const dx = wx - s.fx, dy = wy - s.fy, dist = Math.hypot(dx, dy);
  let sp = (s.state === 'run' ? s.speed * 1.9 : s.state === 'carry' ? s.speed * 0.78 :
              s.state === 'drag' ? 0.34 : s.enemy ? 0.52 : s.speed) * (s.enemy ? 1 : (sim.speedK || 1));
  const tileHere = tileAt(Math.floor(s.fx), Math.floor(s.fy));
  if (tileHere && tileHere.rubble > 0.3) sp *= 0.55;                       // rubble is slow going
  const tKey = Math.floor(s.fx) + ',' + Math.floor(s.fy);                  // feet wear the ground dark
  if (s.lastTile !== tKey){ s.lastTile = tKey; if (tileHere) tileHere.worn = Math.min(1, tileHere.worn + 0.045); }
  if (dist < 0.05){ // arrived at node: check the edge we just crossed for a climb
    const cur = tileAt(Math.floor(s.fx), Math.floor(s.fy)), nxt = tileAt(node[0], node[1]);
    s.pathI++;
    if (s.pathI >= s.path.length){ s.path = null; arrive(s); return; }
    return; }
  const mx = dx / dist, my = dy / dist;
  s.vx = mx * sp; s.vy = my * sp;
  s.fx += mx * Math.min(dist, sp * dt); s.fy += my * Math.min(dist, sp * dt);
  s.faceA = Math.atan2(my, mx);
  s.phase += sp * dt * 4.4;
  // stepping into a tile of a different height: ladders and scrambles are events, not glides
  const here = tileAt(Math.floor(s.fx), Math.floor(s.fy));
  if (here && Math.abs(here.z - s.z) > 0.6 && !s.climbing)
    s.climbing = { t: 1.05, dur: 1.05, z0: s.z, z1: here.z };
  const tz = (here || { z: s.z }).z + (s.onStep && s.path === null ? 0.55 : 0);
  if (!s.climbing) s.z += (tz - s.z) * Math.min(1, dt * 7);
  // mud at the heel
  if (sp > 0.4 && rng() < dt * 5) sim.parts.push({ kind:'dirt', fx: s.fx, fy: s.fy, z: s.z, ox: rr(-3, 3), oy: 0, h: 1.6, vx: rr(-7, 7), vy: rr(-2, 2), vh: rr(14, 30), life: rr(.25, .45), t: 0, col: PAL.soilDark, r: rr(0.8, 1.5) });
}
function arrive(s){
  const act = s.arriveAct; s.arriveAct = null;
  if (s.role === 'carrier'){ arriveCarrier(s); return; }
  if (act === 'bow'){ s.vig = { pose: 'bow', t: rr(5, 8) }; setState(s, 'idle', 1); }
  else if (act === 'post'){ setState(s, 'watch', rr(4, 8)); }
  else if (act === 'despawn'){ s.gone = true; }
  else if (act === 'bunk'){ setState(s, 'sleep', rr(20, 40)); }
  else setState(s, 'idle', rr(0.5, 1.6));

/* ---- iso figure: built from shaded parts, pixel-snapped ---- */
function facingOf(s){
  const dx = Math.cos(s.faceA), dy = Math.sin(s.faceA);

function quad(x1, y1, x2, y2, w1, w2, col){

  ctx.moveTo(Math.round(x1 + nx * w1), Math.round(y1 + ny * w1)); ctx.lineTo(Math.round(x2 + nx * w2), Math.round(y2 + ny * w2));
  ctx.lineTo(Math.round(x2 - nx * w2), Math.round(y2 - ny * w2)); ctx.lineTo(Math.round(x1 - nx * w1), Math.round(y1 - ny * w1));
  ctx.closePath(); ctx.fill();

function drawMan(s){

    quad(sx - 12, sy - 3, sx + 8, sy - 4 + breathe * 0.3, 3.4, 4.2, uni);
    quad(sx - 12, sy - 1.6, sx - 20, sy - 0.6, 2.4, 1.8, uniD);
    ctx.fillStyle = PAL.skin; ctx.beginPath(); ctx.arc(sx + 12.4, sy - 4.4 + breathe * 0.3, 4.4, 0, 6.29); ctx.fill();
    ctx.fillStyle = uniD; ctx.beginPath(); ctx.ellipse(sx + 12.4, sy - 6.6 + breathe * 0.3, 6, 2.7, 0, Math.PI, 0); ctx.fill();

  const shY = hipY - 14.5, headY = shY - 5.2;

  const hipX = sx, shX = sx + (F === 'S' || F === 'N' ? 0 : mir * lean * 0.4) + (F === 'S' ? lean * 0.3 : 0);

    const fy2 = sy - (moving ? Math.max(0, Math.cos(s.phase + ph)) * 2.2 : 0);

function spawnShell(tx, ty, fromRear){

  sim.parts.push({ kind:'shell', fx: tx + rr(-3, -1), fy: ty + rr(2.5, 4), tx, ty, z: tz, p: 0, t: 0, dur: rr(0.75, 1.05) });

function burst(bx, by){
  const cx = Math.floor(bx), cy = Math.floor(by);
  const t = tileAt(cx, cy); if (!t) return;
  sim.scorch.set(cx + ',' + cy, 1);                       // scorch never fully fades
  for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++){
    const tt = tileAt(cx + dx, cy + dy); if (!tt) continue;
    const centre = dx === 0 && dy === 0;
    if (tt.type === 'trench' || tt.type === 'dug'){ tt.damage = Math.min(1, tt.damage + (centre ? 0.55 : 0.22)); if (centre) tt.rubble = Math.min(1, tt.rubble + 0.5); }
    else if (tt.type === 'ground'){ tt.damage = Math.min(1, tt.damage + (centre ? 0.4 : 0.22));
      if (centre && rng() < 0.55 && !sim.map.noCrater.has(tt.gx + ',' + tt.gy)){ tt.type = 'crater'; tt.z = -0.35; tt.filled = false; } } }
  sim.lights.push({ fx: bx, fy: by, z: t.z, r: 120, t: 0, ttl: 0.28 });
  sim.shake = Math.min(7, sim.shake + 3.4);
  for (let i = 0; i < 20; i++) sim.parts.push({ kind:'dirt', fx: bx, fy: by, z: t.z, ox: rr(-4, 4), oy: rr(-2, 2), h: rr(0, 6),
    vx: rr(-16, 16), vy: rr(-8, 4), vh: rr(60, 190), life: rr(.4, 1), t: 0, col: PAL.soilDark, r: rr(1.2, 2.8) });
  sim.parts.push({ kind:'ring', fx: bx, fy: by, z: t.z, t: 0, life: 0.5 });
  sim.soldiers.forEach(s => { if (s.dead) return;
    const d = Math.hypot(s.fx - bx, s.fy - by);
    if (d < 1 && s.state !== 'down') wound(s, 'shell');
    else if (d < 2.6) s.duck = Math.max(s.duck, rr(0.7, 1.4)); });
}
function dropJob(s){ if (s.job){ s.job = null; } }
function wound(s, cause){
  if (s.state === 'down' || s.dead) return;
  dropJob(s);
  const tt = tileAt(Math.floor(s.fx), Math.floor(s.fy)); if (tt) tt.stain = Math.min(1, tt.stain + 0.65);
  const roll = rng();

}

/* ================= the works: jobs, repairs, and the big project ================= */
function regenJobs(){
  const held = new Set(sim.soldiers.filter(s => s.job).map(s => s.job.type + ':' + s.job.gx + ',' + s.job.gy));
  const jobs = []; let dmgSum = 0, dmgN = 0, fills = 0;
  for (let gy = 0; gy < MH; gy++) for (let gx = 0; gx < MW; gx++){ const t = sim.grid[gy][gx];
    if (t.type === 'trench' || t.type === 'dug'){ dmgSum += t.damage; dmgN++;
      if ((t.damage >= 0.3 || t.rubble >= 0.3) && !held.has('repair:' + gx + ',' + gy)) jobs.push({ type:'repair', gx, gy }); }
    else if (t.type === 'crater' && !t.filled && gy >= 10 && gy <= 16 && fills < 2 && !held.has('fill:' + gx + ',' + gy)){ jobs.push({ type:'fill', gx, gy }); fills++; } }
  sim.avgDamage = dmgN ? dmgSum / dmgN : 0;
  if (sim.project){ const P = sim.project;
    const stand = P.idx === 0 ? [P.gx, trenchY(P.gx)] : P.tiles[P.idx - 1];
    const n = sim.soldiers.filter(s => s.job && s.job.type === 'project').length;
    for (let i = n; i < 2; i++) jobs.push({ type:'project', gx: P.tiles[P.idx][0], gy: P.tiles[P.idx][1], stand }); }
  sim.jobs = jobs;
}
function maybeStartProject(){
  if (sim.project || sim.sapDone || sim.raid.active || sim.t < 420 || sim.crates < 4 || (sim.avgDamage || 0) >= 0.3) return;
  const starts = []; for (let gx = 8; gx <= 34; gx++) starts.push(gx);
  starts.sort(() => rng() - 0.5);
  for (const gx of starts){ const ly = trenchY(gx);
    const tiles = [[gx, ly - 1], [gx, ly - 2], [gx, ly - 3]];
    if (tiles.every(([x, y]) => { const t = tileAt(x, y); return t && t.type === 'ground'; })){
      sim.project = { gx, tiles, idx: 0, stage: 'dig', prog: 0 }; return; } }
}
function projectWork(s, j, dt){

    for (let i = 0; i < steps; i++) update(1 / 20); }
  if (qs.get('raid')) sim.nextRaid = Math.min(sim.nextRaid, 1);
  if (qs.get('camx')) { cam.mode = 'user'; cam.idleT = -9999; cam.x = parseFloat(qs.get('camx')); cam.y = parseFloat(qs.get('camy') || '330');
    cam.zoom = parseFloat(qs.get('zoom') || '1'); }
  window.__sim = sim; window.__shotReady = true;
}
$('dice').addEventListener('click', () => { $('seed').value = String(ri(1, 999999)); });
$('begin').addEventListener('click', startSim);
$('planet').addEventListener('keydown', e => { if (e.key === 'Enter') startSim(); });
$('seed').addEventListener('keydown', e => { if (e.key === 'Enter') startSim(); });
if (qs.get('auto')) startSim();
let lastT = performance.now();
function loop(now){ requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (sim){ update(dt); draw(); } }
requestAnimationFrame(loop);
</script>
</body>
</html>
