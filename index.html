<script>
'use strict';
/* ================= deterministic RNG ================= */
function hashStr(s){ let h = 2166136261 >>> 0; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry32(a){ return function(){ a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let rng = mulberry32(1);
const rr = (a,b)=> a + rng()*(b-a), ri = (a,b)=> Math.floor(rr(a, b+0.999)), pick = arr => arr[Math.floor(rng()*arr.length) % arr.length];
const clamp = (v,a,b)=> Math.max(a, Math.min(b, v)), lerp = (a,b,k)=> a+(b-a)*k;
function hash2(x, y){ const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); }
function vnoise(x, y){ const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash2(xi, yi), hash2(xi + 1, yi), u), lerp(hash2(xi, yi + 1), hash2(xi + 1, yi + 1), u), v); }

/* ================= canvas: full-bleed, DPR-aware ================= */
const cv = document.getElementById('cv'); let ctx = cv.getContext('2d');
let VW = 1280, VH = 720, DPR = 1;
function fit(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = window.innerWidth; VH = window.innerHeight;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  baseZoom = VW < VH ? clamp(Math.max(VW / 680, VH / 1180), 0.55, 0.95) : clamp(VW / 1250, 0.7, 1.05);  // portrait: fit the field's height, roam its width
  if (cam.mode === 'director') cam.zoom += (baseZoom * cam.dzoom - cam.zoom) * 0.5;
}
let baseZoom = 1;
addEventListener('resize', fit);

/* ================= iso projection ================= */
const TW = 64, TH = 32, ZH = 23;                               // tile w/h, px per z level
const MW = 92, MH = 58;                                        // a battalion front, not a diorama
function isoX(fx, fy){ return (fx - fy) * TW / 2; }
function isoY(fx, fy, z){ return (fx + fy) * TH / 2 - (z || 0) * ZH; }

/* ================= camera: user's hands, director at idle ================= */
const cam = { x: 816, y: 1060, zoom: 1, mode: 'director', idleT: 0, tx: 816, ty: 1060, dzoom: 1, focusT: 0 };
const IDLE_DIRECTOR_S = 9;
function camDirector(dt){
  cam.focusT -= dt;
  if (cam.focusT <= 0){ cam.focusT = rr(13, 22);
    const foci = [ [816, 1070, 0.95], [592, 1051, 1.25], [512, 1500, 1.15], [1120, 1740, 1.2],
                   [1264, 840, 0.95], [-896, 950, 1.1], [352, 1210, 1.2], [-928, 700, 1.15],
                   [496, 1224, 1.05], [-128, 1536, 1.1], [1800, 1000, 1.1], [-300, 1080, 1.2] ];
    const f = pick(foci); cam.tx = f[0] + rr(-26, 26); cam.ty = f[1] + rr(-14, 14); cam.dzoom = f[2]; }
  const k = Math.min(1, dt * 0.3);
  cam.x = lerp(cam.x, cam.tx, k); cam.y = lerp(cam.y, cam.ty, k);
  cam.zoom = lerp(cam.zoom, baseZoom * cam.dzoom, Math.min(1, dt * 0.5));
}
function camUpdate(dt){
  if (cam.mode === 'user'){ cam.idleT += dt;
    if (cam.idleT > IDLE_DIRECTOR_S){ cam.mode = 'director'; cam.tx = cam.x; cam.ty = cam.y; cam.focusT = 0; } }
  else camDirector(dt);
  cam.x = clamp(cam.x, -1650, 2750); cam.y = clamp(cam.y, 140, 2280);
  cam.zoom = clamp(cam.zoom, 0.55, 3.2);
}
function toScreen(wx, wy){ return [ (wx - cam.x) * cam.zoom + VW/2, (wy - cam.y) * cam.zoom + VH/2 ]; }
/* pointer control: drag pans, wheel zooms, pinch zooms */
const pointers = new Map(); let pinchD = 0;
function userGrab(){ cam.mode = 'user'; cam.idleT = 0; }
cv.addEventListener('pointerdown', e => { pointers.set(e.pointerId, [e.clientX, e.clientY]); userGrab();
  if (pointers.size === 2){ const p = [...pointers.values()]; pinchD = Math.hypot(p[0][0]-p[1][0], p[0][1]-p[1][1]); } });
cv.addEventListener('pointermove', e => { if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]); userGrab();
  if (pointers.size === 1){ cam.x -= (e.clientX - prev[0]) / cam.zoom; cam.y -= (e.clientY - prev[1]) / cam.zoom; }
  else if (pointers.size === 2){ const p = [...pointers.values()];
    const d = Math.hypot(p[0][0]-p[1][0], p[0][1]-p[1][1]);
    if (pinchD > 0) cam.zoom = clamp(cam.zoom * d / pinchD, 0.55, 3.2); pinchD = d; } });
['pointerup','pointercancel'].forEach(ev => cv.addEventListener(ev, e => { pointers.delete(e.pointerId); pinchD = 0; }));
cv.addEventListener('wheel', e => { e.preventDefault(); userGrab();
  cam.zoom = clamp(cam.zoom * (e.deltaY < 0 ? 1.09 : 0.92), 0.55, 3.2); }, { passive: false });

/* ================= palette ================= */
let PAL = null;
function makePalette(){
  const families = [
    { sky:[196,32,26], soil:[88,26,25],  accent:[38,95,55]  },
    { sky:[222,28,27], soil:[210,18,23], accent:[28,90,55]  },
    { sky:[18,38,26],  soil:[24,30,24],  accent:[190,85,55] },
    { sky:[268,26,24], soil:[262,16,22], accent:[44,92,55]  },
    { sky:[150,22,26], soil:[95,20,23],  accent:[16,88,52]  } ];
  const f = pick(families), hsl = (h,s,l)=>`hsl(${h},${s}%,${l}%)`;
  return { skyDay: hsl(f.sky[0], f.sky[1] - 8, 50), skyNight: hsl(f.sky[0], 30, 6),
    soilC: [f.soil[0], f.soil[1], f.soil[2]], grassC: [f.soil[0] + 30, 18, f.soil[2] + 4],
    soil: hsl(f.soil[0], f.soil[1], f.soil[2]), freshSoil: hsl(f.soil[0], f.soil[1] - 4, f.soil[2] + 9), soilDark: hsl(f.soil[0], f.soil[1], f.soil[2]-6),
    soilDeep: hsl(f.soil[0], f.soil[1], Math.max(4, f.soil[2]-11)),
    grass: hsl(f.soil[0]+30, 18, f.soil[2]+4),
    timber: hsl(32, 30, 34), timberDark: hsl(32, 28, 22), cloth: hsl(f.soil[0]+20, 12, 42),
    uniform: hsl(f.soil[0]+8, 16, 38), uniformDark: hsl(f.soil[0]+8, 16, 26),
    skin: hsl(28, 42, 60), skinDark: hsl(28, 36, 48),
    accent: hsl(f.accent[0], f.accent[1], f.accent[2]), accent2: hsl((f.accent[0]+150)%360, 80, 58),
    moon: hsl(f.sky[0], 20, 84) };
}
fit();

/* ================= the field ================= */
const DAY_LEN = 130;
let sim = null, perfT = 0, simLight = 1, moonI = 0, moonLight = 0, moonCyc = 0;
const trenchY = gx => 20 + (Math.floor(gx / 4) % 2 ? 1 : 0);
const supportY = gx => 30 + (Math.floor(gx / 6) % 2 ? 1 : 0);
const enemyY  = gx => 6 + (Math.floor(gx / 5) % 2 ? 1 : 0);
function tileAt(gx, gy){ gx = Math.floor(gx); gy = Math.floor(gy); return (gx < 0 || gy < 0 || gx >= MW || gy >= MH) ? null : sim.grid[gy][gx]; }
function buildMap(){
  const grid = [];
  for (let gy = 0; gy < MH; gy++){ grid.push([]);
    for (let gx = 0; gx < MW; gx++) grid[gy].push({ gx, gy, z: 0, type: 'ground',
      damage: 0, patched: 0, chips: 0, stain: 0, worn: 0, rubble: 0, filled: false, sap: false, fitted: false, traces: null }); }
  const set = (gx, gy, type, z) => { const t = grid[gy] && grid[gy][gx]; if (t){ t.type = type; t.z = z; } };
  // the enemy front, wider now
  for (let gx = 2; gx < 90; gx++) set(gx, enemyY(gx), 'etrench', -1);
  // our front line in three sectors, with fire steps
  for (let gx = 4; gx < 88; gx++){ set(gx, trenchY(gx), 'trench', -1); grid[trenchY(gx)][gx].step = true; }
  // the support line
  for (let gx = 6; gx < 86; gx++) set(gx, supportY(gx), 'trench', -1);
  // communication trenches: front to support at each sector, then on to the rear
  const comm = (gx, y0, y1) => { for (let gy = y0; gy <= y1; gy++) set(gx, gy, 'trench', -1); };
  [18, 46, 74].forEach(gx => comm(gx, Math.min(trenchY(gx), supportY(gx)), Math.max(trenchY(gx), supportY(gx))));
  comm(46, supportY(46) + 1, 36);                       // HQ sap
  comm(18, supportY(18) + 1, 38);                       // to the depot yard
  comm(74, supportY(74) + 1, 35);                       // to the aid station
  // dugout rooms: one per sector behind the front line, billets behind support, HQ deep rooms
  const room = (x0, x1, y0, y1, kind) => { for (let gx = x0; gx <= x1; gx++)
    for (let gy = y0; gy <= y1; gy++) set(gx, gy, kind, -1); };
  room(12, 15, 22, 24, 'dug'); room(40, 43, 22, 24, 'dug'); room(68, 71, 22, 24, 'dug');
  for (let gx = 12; gx <= 15; gx++) set(gx, trenchY(gx) + 1, 'trench', -1);
  for (let gx = 40; gx <= 43; gx++) set(gx, trenchY(gx) + 1, 'trench', -1);
  for (let gx = 68; gx <= 71; gx++) set(gx, trenchY(gx) + 1, 'trench', -1);
  room(28, 33, 32, 33, 'dug');                          // billets
  room(52, 59, 38, 41, 'dug');                          // HQ
  room(71, 74, 41, 42, 'dug');                          // aid annex
  for (let gx = 46; gx <= 52; gx++) set(gx, 37, 'trench', -1);   // HQ sap runs east into the rooms
  set(73, 40, 'trench', -1); set(74, 40, 'trench', -1);          // aid floor down into the annex
  // surface buildings: floors the men work on
  const floor = (x0, x1, y0, y1) => { for (let gx = x0; gx <= x1; gx++) for (let gy = y0; gy <= y1; gy++) set(gx, gy, 'floor', 0); };
  floor(70, 76, 37, 39);                                // aid station
  floor(40, 48, 34, 36);                                // cookhouse
  floor(12, 17, 40, 42);                                // depot shed
  floor(83, 85, 33, 34);                                // latrine screens
  // the road along the rear
  for (let gx = 0; gx < MW; gx++){ set(gx, 50, 'road', 0); set(gx, 51, 'road', 0); }
  // worn paths: support to cookhouse, HQ yard, depot yard
  const path = (x0, x1, y0, y1) => { for (let gx = x0; gx <= x1; gx++) for (let gy = y0; gy <= y1; gy++)
    if (grid[gy][gx].type === 'ground') set(gx, gy, 'path', 0); };
  path(40, 48, 32, 33); path(49, 62, 36, 37); path(10, 21, 38, 39); path(63, 70, 37, 37);
  // craters across no man's land, thicker than before
  for (let i = 0; i < 42; i++){ const gx = ri(3, 88), gy = ri(9, 17); set(gx, gy, 'crater', -0.35); }
  const wire = [];
  for (let gx = 4; gx < 88; gx += 2){ wire.push([gx, 17]); if (hash2(gx, 31) < 0.55) wire.push([gx + 1, 12]); }
  const ladders = new Set();
  const lad = (a, b) => { ladders.add(a + '>' + b); ladders.add(b + '>' + a); };
  lad('46,36', '46,37'); lad('18,38', '18,39'); lad('74,35', '74,36');
  lad('12,24', '12,27'); lad('43,24', '43,27'); lad('68,24', '68,27');   // dugout shafts
  lad('30,33', '30,36'); lad('55,41', '55,44');                            // billets + HQ shafts
  lad('73,39', '73,40');                                                   // aid floor to annex step
  const sentryTiles = [];
  for (let gx = 6; gx <= 86; gx += 4) sentryTiles.push([gx, trenchY(gx)]);
  const bunkTiles = [[13, 24], [14, 24], [15, 24], [41, 24], [42, 24], [43, 24], [69, 24], [70, 24], [71, 24],
                     [29, 33], [30, 33], [31, 33], [32, 33], [33, 33], [72, 42], [73, 42]];
  const graveTiles = [];
  for (let gx = 4; gx <= 10; gx++) for (let gy = 34; gy <= 37; gy++) graveTiles.push([gx, gy]);
  const sectors = [
    { id: 'A', x0: 6, x1: 32, dug: [12, 15], comm: 18 },
    { id: 'B', x0: 34, x1: 60, dug: [40, 43], comm: 46 },
    { id: 'C', x0: 62, x1: 86, dug: [68, 71], comm: 74 } ];
  const queueTiles = [];
  for (const gx of [44, 43, 45, 42, 46, 41, 47, 40, 48, 39, 49, 38]) queueTiles.push([gx, supportY(gx)]);
  return { grid, wire, ladders, sectors, queueTiles,
    hatchTiles: [[12, 27], [43, 27], [68, 27], [30, 36], [55, 44]],
    sentryTiles, bunkTiles, graveTiles,
    anchors: { hq: [55, 39], hqYard: [56, 36], aid: [73, 38], aidBeds: [[71, 37], [73, 37], [75, 37], [72, 39], [74, 39]],
               depot: [15, 43], depotShed: [14, 41], cook: [44, 35], cookPot: [42, 35], roadY: 50,
               phone: [54, 40], table: [56, 39] } };
}
function walkable(t, enemy){
  if (!t) return false;
  if (t.type === 'etrench') return !!enemy;
  return ['ground','crater','trench','dug','floor','road','path'].includes(t.type);
}
function quietSpot(gx, gy){
  /* the step-aside: a hot tile trades its talk to the quietest ground near */
  const o = tileAt(gx, gy); if (!o) return [gx, gy];
  if (!sim.busyCost || sim.busyCost[gy * MW + gx] < 25) return [gx, gy];
  let best = null, bestScore = 1e9;

    ledger: [], intel: [{ dmg: 0, ammo: 8, t: 0 }, { dmg: 0, ammo: 8, t: 0 }, { dmg: 0, ammo: 8, t: 0 }], intelWire: { down: false, t: 0 }, inflight: [], radioRetry: [], repT: 25, wireCut: null, order: null, pendingAssign: null, queue: [], freshScars: {}, works: null, works2: null, worksCycle: 0, searchlights: [], seedStr, planetName, moonOff: hash2(hashStr(seedStr + '|' + planetName), 5.1) * 29.5, cat: { fx: 44.5, fy: 36.4, z: 0, mode: 'sit', t: 3, tx: 44.5, ty: 36.4, faceA: 0 },

    missionQ: [], emMissionQ: [], dramaT: rr(26, 44), orderT: rr(50, 90), logisticsT: 4, batteryT: 2, talkT: 6,

    saw: { active: false, pair: [], t: 0, stroke: 0 },
    social: [], socialT: 5, rumDay: -1, mailT: 260,
    busy: new Int16Array(MW * MH), busyCost: new Uint8Array(MW * MH), busyT: 0,
    duels: [], kitty: [], cardSeq: 0,
    league: { table: {}, results: [], honours: [], season: 1, week: undefined, inSeason: true, burned: 0 },
    flare: [0, 1, 2].map(() => ({ mode: 'quiet', t: rr(20, 45), next: rr(4, 18) })), contact: [0.2, 0.2, 0.2],
    confuse: [0, 0, 0], leaderT: 0, officerT: 0,
    plane: { active: false, fx: -8, fy: 8 },
    drops: [], crates: [], hulks: [],
    stocks: { depot: { food: 14, ammo: 26, shells: 34, timber: 16, logs: 4, water: 20, oil: 6, med: 6, cable: 5 },
      sectors: [{ ammo: 8, timber: 5, water: 6, oil: 2 }, { ammo: 8, timber: 5, water: 6, oil: 2 }, { ammo: 8, timber: 5, water: 6, oil: 2 }],
      cook: { food: 5, water: 8, oil: 2 }, battery: { shells: 0, oil: 2 }, aid: { med: 5, oil: 2 }, hq: { oil: 3, cable: 4 } },
    guns: [ { fx: 26.5, fy: 45.5, z: 0, enemy: false, ammo: 10, cycle: 'idle', ct: rr(1, 3), recoil: 0, recX: 0, recV: 0, flash: 0, elev: rr(.2, .5) },
            { fx: 30, fy: 46.8, z: 0, enemy: false, ammo: 10, cycle: 'idle', ct: rr(1, 3), recoil: 0, recX: 0, recV: 0, flash: 0, elev: rr(.2, .5) },
            { fx: 33.5, fy: 45.6, z: 0, enemy: false, ammo: 10, cycle: 'idle', ct: rr(1, 3), recoil: 0, recX: 0, recV: 0, flash: 0, elev: rr(.2, .5) } ],
    eguns: [ { fx: 30.5, fy: 2.2, z: 0, enemy: true, ammo: 99, cycle: 'idle', ct: rr(2, 5), recoil: 0, recX: 0, recV: 0, flash: 0, elev: rr(.2, .5) },
             { fx: 48.5, fy: 1.6, z: 0, enemy: true, ammo: 99, cycle: 'idle', ct: rr(2, 5), recoil: 0, recX: 0, recV: 0, flash: 0, elev: rr(.2, .5) },
             { fx: 66.5, fy: 2.4, z: 0, enemy: true, ammo: 99, cycle: 'idle', ct: rr(2, 5), recoil: 0, recX: 0, recV: 0, flash: 0, elev: rr(.2, .5) } ],
    dirty: new Set(), cache: null, caching: false,
    trenchTiles: [], dugA: [], dugB: [] };
  for (let gx = 4; gx < 88; gx++) sim.trenchTiles.push([gx, trenchY(gx)]);
  sim.map.sectors.forEach(sec => { for (let gx = sec.dug[0]; gx <= sec.dug[1]; gx++) for (let gy = 22; gy <= 24; gy++) (sec.id === 'A' ? sim.dugA : sim.dugB).push([gx, gy]); });
  sim.props = buildProps();
  const add = (role, tile, extra) => { const s = makeSoldier(role, tile);
    s.variant = ri(0, 3); s.clean = rr(0.05, 0.5);
    if (extra) Object.assign(s, extra); sim.soldiers.push(s); return s; };
  const A = map.anchors;
  add('officer', A.hq, { sector: 1 });
  add('sergeant', [46, supportY(46)], { sector: 1 });
  add('sergeant', [18, supportY(18)], { sector: 0 });
  add('sergeant', [28, 44], { sector: 1 });                                   // the battery sergeant
  add('runner', A.hqYard, {}); add('runner', [57, 36], {});
  add('sign', A.phone, { sector: 1 }); add('sign', [46, trenchY(46)], { sector: 1 });
  add('cook', [43, 35], {}); add('cook', [45, 36], {});
  add('medic', [72, 38], {}); add('medic', [74, 38], {});
  add('carrier', [14, 43], {}); add('carrier', [16, 43], {}); add('carrier', [15, 44], {});
  add('sapper', [46, supportY(46)], { sector: 1 }); add('sapper', [18, trenchY(18)], { sector: 0 });
  add('sapper', [74, supportY(74)], { sector: 2 }); add('sapper', [41, 23], { sector: 1 });
  const pair1a = add('bearer', [72, 36], {}), pair1b = add('bearer', [73, 36], {});
  pair1a.pairId = pair1b.id; pair1b.pairId = pair1a.id; pair1a.pairPartner = pair1b; pair1b.pairPartner = pair1a;
  const pair2a = add('bearer', [46, 32], { sector: 1 }), pair2b = add('bearer', [47, 32], { sector: 1 });
  pair2a.pairId = pair2b.id; pair2b.pairId = pair2a.id; pair2a.pairPartner = pair2b; pair2b.pairPartner = pair2a;
  const gunPosts = [[[25, 44], [27, 44], [26, 47]], [[29, 45], [31, 45], [30, 48]], [[32, 44], [34, 44], [33, 47]]];
  sim.guns.forEach((g, gi) => gunPosts[gi].forEach((pt, slot) => {
    const s = add('gunner', pt, { gun: gi, gunSlot: slot }); if (slot === 0) s.rank = 'cpl'; g['crew' + slot] = s.id; }));
  sim.eguns.forEach((g, gi) => [[-2, 1], [2, 1]].forEach(([dx, dy], slot) => {
    const s = add('egun', [Math.floor(g.fx) + dx, Math.floor(g.fy) + dy], { gun: gi, gunSlot: slot }); s.enemy = true; }));
  add('observer', [46, trenchY(46)], { sector: 1, onStep: true });
  const sentryBySector = [[10, 18, 26], [38, 46, 54], [66, 74, 82]];
  map.sectors.forEach((sec, si) => {
    sentryBySector[si].forEach(gx => { const s = add('sent', [gx, trenchY(gx)], { sector: si });
      s.role = 'sent'; s.onStep = true; setState(s, 'watch', rr(3, 7)); });
    add('rifle', [sec.dug[0] + 1, 23], { sector: si }); add('rifle', [sec.dug[0] + 2, 22], { sector: si }); });
  [10, 26, 42, 58, 74, 86].forEach(gx => { const s = add('esent', [gx, enemyY(gx)], {}); s.enemy = true; setState(s, 'watch', rr(4, 9)); });
  [22, 40, 58, 76].forEach(gx => { const s = add('esap', [gx, enemyY(gx)], {}); s.enemy = true; s.hx = gx; s.hy = enemyY(gx); s.crouch = true; setState(s, 'idle', rr(2, 5)); });
  sim.soldiers.forEach((s, i) => { const o = sim.soldiers[(i + 3) % sim.soldiers.length];
    if (!o.enemy && !s.enemy){ s.friend = o.id; if (o.friend === -1) o.friend = s.id; } });
  sim.soldiers.forEach(s => { if (s.friend >= 0){ const f = sim.soldiers.find(x => x.id === s.friend);
    if (f){ s.bond = s.bond || {}; s.bond[f.id] = 0.3; f.bond = f.bond || {}; f.bond[s.id] = 0.3; } } });
  const rifles = sim.soldiers.filter(s => s.trade === 'rifle');
  for (let i = 0; i + 1 < rifles.length && i < 6; i += 2){ rifles[i].rival = rifles[i + 1].id; rifles[i + 1].rival = rifles[i].id; }
  /* stitch the zigzag: where a dug line steps diagonally, fill one corner tile,
     or the line is pretty to look at and impossible to walk. */
  for (let gy = 0; gy < MH - 1; gy++) for (let gx = 0; gx < MW - 1; gx++){
    const stitch = (a, b, c1, c2) => { if (trenchLike(a) && trenchLike(b) && a.z === b.z && !trenchLike(c1) && !trenchLike(c2)){
      const t = rng() < 0.5 ? c1 : c2; t.type = a.type; t.z = a.z; } };
    stitch(tileAt(gx, gy), tileAt(gx + 1, gy + 1), tileAt(gx + 1, gy), tileAt(gx, gy + 1));
    stitch(tileAt(gx + 1, gy), tileAt(gx, gy + 1), tileAt(gx, gy), tileAt(gx + 1, gy + 1)); }
  sim.soldiers.forEach(s => { if (!s.enemy){ s.deck = makeDeck(); s.leagueIn = true; } });
  sim.veg = new Float32Array(MW * MH); sim.vegMax = new Float32Array(MW * MH);
  sim.vegScorch = new Float32Array(MW * MH); sim.bend = new Float32Array(MW * MH);
  sim.bendA = new Float32Array(MW * MH); sim.bendHot = new Set();
  sim.graveSet = new Set();
  sim.map.graveTiles.forEach(([ga, gb]) => { for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) sim.graveSet.add((gb + dy) * MW + (ga + dx)); });
  for (let gy = 0; gy < MH; gy++) for (let gx = 0; gx < MW; gx++){ const t = tileAt(gx, gy), i = gy * MW + gx; if (!t) continue;
    let base = 0;
    if (t.type === 'ground'){ const zone = gy > 33 ? 1 : (gy < 18 ? 0.34 : 0.62);
      base = clamp((hash2(gx * 3.7 + 11, gy * 5.1 + 7) * 0.75 + hash2(gx * 0.9 + 3, gy * 1.3) * 0.45 - 0.16) * zone, 0, 1);
      if (t.rubble > 0.25) base *= 0.3; }
    else if (t.type === 'crater') base = hash2(gx * 7.7, gy * 3.3) < 0.3 ? 0.25 : 0;
    sim.vegMax[i] = base; sim.veg[i] = base; }
  let planted = 0, guard = 0;
  while (planted < 7 && guard++ < 400){ const gx = ri(3, 88), gy = ri(34, 55), t = tileAt(gx, gy);
    if (!t || t.type !== 'ground' || t.rubble > 0.2) continue;
    if (gx > 9 && gx < 40 && gy > 37 && gy < 51) continue;                       // depot, saw pit, battery
    if (gy >= 49 && gy <= 52) continue;                                         // the road
    if (gx > 38 && gx < 51 && gy > 29 && gy < 39) continue;                     // the cookhouse
    if (sim.props.some(p => Math.abs(p.fx - gx - 0.5) < 3 && Math.abs(p.fy - gy - 0.5) < 3)) continue;
    sim.props.push({ kind: 'tree', fx: gx + 0.5, fy: gy + 0.5, z: 0, variant: ri(0, 2) }); planted++; }
  buildCache();
  logEvent('start', 'The battalion took over the line before dawn.', []);
}
/* ================= setup + main loop ================= */
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
function startSim(){
  const planet = (($('planet').value || '').trim() || qs.get('planet') || 'Unnamed');
  const seed = (($('seed').value || '').trim() || qs.get('seed') || String(ri(1, 99999)));
  $('setup').style.display = 'none';
  WarAudio.init();
  const sb = $('sndBtn'); sb.style.display = 'flex'; sb.onclick = () => WarAudio.toggle();
  const pb = $('paperBtn'); pb.style.display = 'flex'; pb.onclick = () => showWeekly(true);
  newSim(planet, seed);
  sim.soldiers.forEach(s => recOf(s));
  if (qs.get('hour')) sim.hour = parseFloat(qs.get('hour'));
  if (qs.get('warp')){ const steps = Math.min(16000, Math.round(parseFloat(qs.get('warp')) * 20));
    for (let i = 0; i < steps; i++) update(1 / 20); }
  if (qs.get('raid')) sim.nextRaid = Math.min(sim.nextRaid, 1);
  if (qs.get('camx')) { cam.mode = 'user'; cam.idleT = -9999; cam.x = parseFloat(qs.get('camx')); cam.y = parseFloat(qs.get('camy') || '330');
    cam.zoom = parseFloat(qs.get('zoom') || '1'); }
  window.__sim = sim; window.__shotReady = true; window.__update = update; window.__buildWeekly = buildWeekly; window.__showWeekly = showWeekly; window.__findPath = findPath; window.__tileAt = tileAt; window.__goTo = goTo; window.__burst = burst; window.__siteWorks = siteWorks; window.__worksTick = worksTick; window.__think = think; window.__regenJobs = regenJobs; window.__warAudio = WarAudio; window.__w2s = w2s; window.__graveTap = graveTap;
}
$('dice').addEventListener('click', () => { $('seed').value = String(ri(1, 999999)); });
$('begin').addEventListener('click', startSim);
$('planet').addEventListener('keydown', e => { if (e.key === 'Enter') startSim(); });
$('seed').addEventListener('keydown', e => { if (e.key === 'Enter') startSim(); });
if (qs.get('auto')) startSim();
let lastT = performance.now();
function loop(now){ requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (sim){ if (!sim.paperOpen) update(dt); draw(); } }
requestAnimationFrame(loop);
